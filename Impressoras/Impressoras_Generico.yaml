            - uuid: 6cde0df7a18949f4b0225863405e2aa6
              name: 'Suprimento {#SNMPVALUE} - Capacidade Máxima'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.43.11.1.1.8.1.{#SNMPINDEX}'
              key: 'prtMarkerSuppliesMaxCapacity[{#SNMPVALUE}]'
              delay: '600'
              history: 7d
              value_type: FLOAT
              valuemap:
                name: 'Status Suprimento'
              tags:
