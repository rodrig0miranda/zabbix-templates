                  value: 'Informacoes da Capacidade Maxima da Unidade'
            - uuid: dc11889a6da44b459cf78ecee622afc3
              name: 'Suprimento {#SNMPVALUE} - Nível ( Porcentagem)'
              type: CALCULATED
              key: 'TempodeVidautilUnit[{#SNMPVALUE}]'
              delay: '900'
              history: 90d
              value_type: FLOAT
              units: '%'
              params: '100*last(//prtMarkerSuppliesLevel[{#SNMPVALUE}])/last(//prtMarkerSuppliesMaxCapacity[{#SNMPVALUE}])'
              preprocessing:
                - type: IN_RANGE
                  parameters:
                    - '0'
                    - '100'
                  error_handler: DISCARD_VALUE
              tags:
                - tag: Application
                  value: 'Informacoes de Vida Util da Unidade'
              trigger_prototypes:
                - uuid: b13c868204a54fcfb47c5aa94039d588
                  expression: 'last(/Impressoras/TempodeVidautilUnit[{#SNMPVALUE}])<{$UNIT_MINIMO}'
                  name: 'Nivel do Toner {#SNMPVALUE} em {ITEM.VALUE}'
                  status: DISABLED
                  priority: WARNING
                  manual_close: 'YES'
      macros:
        - macro: '{$CUSTO_PAGINA}'
          value: '0.22'
          description: 'Valor da página'
        - macro: '{$CUSTO_RESMA}'
          value: '20.00'
