              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.43.11.1.1.6.1.{#SNMPINDEX}'
              key: 'prtMarkerSuppliesDescription[{#SNMPVALUE}]'
              delay: '600'
              history: 7d
              value_type: CHAR
              trends: '0'
              tags:
