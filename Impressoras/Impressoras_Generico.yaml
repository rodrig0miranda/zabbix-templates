zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: d3946f7107f14862a29e3e843fca2c99
      name: Templates/Printers
  templates:
    - uuid: f59ec15677c5428ab0ea0f9ce1e9369f
      template: Impressoras
      name: Impressoras
      description: 'Um template genérico para monitorar todas as impressoras e coletar as informações mais importantes.'
      groups:
        - name: Templates/Printers
      items:
        - uuid: cf69e33cd81f49e0b5a541fb0411494b
          name: 'Contador de Paginas Impressas Por Dia'
          type: CALCULATED
          key: contador_impressoes_dia
          delay: 0;h00m02
          history: 60d
          trends: 90d
          units: Paginas
          params: last(//prtMarkerLifeCount.1.1)
          description: 'Coleta agendada as 00:02hs todos os dias.'
          tags:
            - tag: Application
              value: 'Informacoes de Paginas Impressas por dia'
        - uuid: 86ef99e14df64fc8b3ede904d417f75d
          name: 'Contador de Paginas Impressas Por Mes'
          type: CALCULATED
          key: contador_impressoes_mes
          delay: 0;md1h00m04
          history: 60d
          trends: 90d
          units: Paginas
          params: last(//prtMarkerLifeCount.1.1)
          description: 'Coleta agendada as 00:04hs todo dia 1º de cada mês, conta o total das páginas impressas desde a última coleta total do mês.'
          tags:
            - tag: Application
              value: 'Informacoes de Paginas Impressas mes'
        - uuid: c50e2c9fba9a4d5dbb056bb08b6c2b52
          name: 'Contador de Paginas Impressas Por Semana'
          type: CALCULATED
          key: contador_impressoes_semana
          delay: 0;wd1h00m03
          history: 60d
          trends: 90d
          units: Paginas
          params: last(//prtMarkerLifeCount.1.1)
          description: 'Coleta agendada as 00:03hs toda segunda feira de cada semana, conta o total das páginas impressas desde a última coleta total da semana.'
          tags:
            - tag: Application
              value: 'Informacoes de Paginas Impressas Por Semana'
        - uuid: 6f95cfcb59434ea9a53543d54a6af75b
          name: '06. Status de Erro no Equipamento'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.25.3.5.1.2.1
          key: hrPrinterDetectedErrorState
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Pega o valor do SNMP (geralmente vem em Hexadecimal) e limpa os espaços
                  var hex = value.replace(/[^0-9A-Fa-f]/g, '');
                  
                  // Se vier vazio ou tudo zero, a máquina ta sem erros
                  if (!hex || hex.match(/^0+$/)) {
                      return 'Sem Erros';
                  }
                  
                  // Converte os dois primeiros bytes pra binário preenchendo os zeros com slice
                  var bin = ('00000000' + parseInt(hex.substring(0, 2), 16).toString(2)).slice(-8);
                  if (hex.length > 2) {
                      bin += ('00000000' + parseInt(hex.substring(2, 4), 16).toString(2)).slice(-8);
                  }
                  
                  var errors = [];
                  
                  // Mapeia os bits da esquerda pra direita
                  if (bin[0] === '1') errors.push('Pouco Papel');
                  if (bin[1] === '1') errors.push('Sem Papel');
                  if (bin[2] === '1') errors.push('Pouco Toner');
                  if (bin[3] === '1') errors.push('Sem Toner');
                  if (bin[4] === '1') errors.push('Porta Aberta');
                  if (bin[5] === '1') errors.push('Papel Atolado');
                  if (bin[6] === '1') errors.push('Offline');
                  if (bin[7] === '1') errors.push('Manutenção Solicitada');
                  if (bin[8] === '1') errors.push('Bandeja de Entrada Ausente');
                  if (bin[9] === '1') errors.push('Bandeja de Saída Ausente');
                  if (bin[10] === '1') errors.push('Toner Ausente');
                  
                  return errors.length > 0 ? errors.join(', ') : 'Erro Desconhecido (' + hex + ')';
          triggers:
            - uuid: d662adce527f4b888c4210b2e3851be0
              expression: 'last(/Impressoras/hrPrinterDetectedErrorState)<>"Sem Erros"'
              name: 'Erro na Impressora {HOST.NAME}: {ITEM.LASTVALUE}'
              priority: WARNING
        - uuid: 6aeeb0901587490aa90db82c87fd6442
          name: '14. Status Geral da Impressora'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.25.3.5.1.1.1
          key: hrPrinterStatus.1
          delay: 60m
          history: 7d
          trends: '0'
          valuemap:
            name: 'Status da impressora'
          tags:
            - tag: Application
              value: 'Informacoes de Disponibilidade do Equipamento'
        - uuid: c12c1f1470a74015b6e6e6d1e0037165
          name: '08. Ping'
          type: SIMPLE
          key: icmpping
          delay: '0;30s/{$INTERVALO_PING}'
          history: 7d
          valuemap:
            name: UP/DOWN
          tags:
            - tag: Application
              value: 'Informacoes de Disponibilidade do Equipamento'
          triggers:
            - uuid: b1fcf120808d4d61be5ca8fc89d7570d
              expression: 'max(/Impressoras/icmpping,#3)=0'
              name: 'A {HOST.NAME} nao Responde a Ping'
              priority: AVERAGE
        - uuid: ca0790979a274c6785d1632fb7380006
          name: '010. Perda de Pacote'
          type: SIMPLE
          key: icmppingloss
          delay: '0;30s/{$INTERVALO_PING}'
          history: 7d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: 'Informacoes de Disponibilidade do Equipamento'
          triggers:
            - uuid: d9be9b32d0014709bce30a6a35fab251
              expression: 'min(/Impressoras/icmppingloss,5m)>20'
              name: 'A perda de ping está muito alta {HOST.NAME}'
              priority: WARNING
              dependencies:
                - name: 'A {HOST.NAME} nao Responde a Ping'
                  expression: 'max(/Impressoras/icmpping,#3)=0'
        - uuid: bbb80a5de95448b3bb95ea4b6873d883
          name: '09. Latencia'
          type: SIMPLE
          key: icmppingsec
          delay: '0;30s/{$INTERVALO_PING}'
          history: 7d
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
