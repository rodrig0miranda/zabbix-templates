          triggers:
            - uuid: 179d3f34c92c4647bfc4a26722d86258
              expression: 'avg(/Impressoras/icmppingsec,5m)>0.15'
              name: 'O tempo de resposta é muito alta na Impressora {HOST.NAME}'
              priority: WARNING
              dependencies:
                - name: 'A {HOST.NAME} nao Responde a Ping'
                  expression: 'max(/Impressoras/icmpping,#3)=0'
        - uuid: 4771273330ca4e9ca9460e6f850514b3
